[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-rule-learning"
version = "0.1.0"
description = "AI Rule Learning System — automatically derive guardrails from conversation patterns"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that touch external services",
    "slow: tests that take longer than a second",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["space/", "mcp/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
