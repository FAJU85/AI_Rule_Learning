name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e mcp

      - name: Check Python formatting
        run: ruff format --check .

      - name: Run Python lint
        run: ruff check .

      - name: Run type checks
        run: mypy src

      - name: Run repository tests
        run: pytest

      - name: Run MCP tests
        run: python -m pytest -c /dev/null mcp/tests -q

      - name: Validate Python build importability
        run: python -m compileall src mcp/ai_rule_learning_mcp

      - name: Send Telegram failure alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "repo")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          ref = os.environ.get("GITHUB_REF_NAME", "")
          actor = os.environ.get("GITHUB_ACTOR", "")
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          text = (
              f"🚨 *CI Pipeline Failure Alert*\n\n"
              f"*Workflow:* `CI / Python Quality & Tests`\n"
              f"*Status:* `FAILED`\n"
              f"*Repository:* `{repo}`\n"
              f"*Branch:* `{ref}`\n"
              f"*Author:* `{actor}`\n\n"
              f"[🔍 View Failure Logs]({run_url})"
          )
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=json.dumps({"chat_id": chat_id, "text": text, "parse_mode": "Markdown"}).encode("utf-8"), headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as e:
              print(e)
          EOF

  markdown:
    name: Markdown and metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
