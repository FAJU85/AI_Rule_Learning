name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome first-time contributors
    runs-on: ubuntu-latest
    steps:
      - name: Post welcome message
        uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue! Please make sure the template is complete, include reproduction steps when relevant, and remove any secrets from logs.
          pr-message: |
            Thanks for opening your first pull request! Please review CONTRIBUTING.md, complete the PR checklist, and make sure CI is passing before requesting review.
