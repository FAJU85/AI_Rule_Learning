name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
      - 'mcp-v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  pypi-publish:
    name: Build and publish ai-rule-learning-mcp to PyPI
    runs-on: ubuntu-24.04
    environment: pypi

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and source distribution
        run: |
          python -m build mcp/

      - name: Verify wheel contents with zipfile
        run: |
          python - << 'EOF'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("mcp/dist/*.whl")
          if not wheels:
              print("ERROR: No wheel found in mcp/dist/")
              sys.exit(1)

          wheel_path = wheels[0]
          print(f"Verifying wheel: {wheel_path}")

          required_files = [
              "ai_rule_learning_mcp/data/catalog_v1.json",
              "ai_rule_learning_mcp/data/context_schema.json",
              "ai_rule_learning_mcp/catalog.py",
              "ai_rule_learning_mcp/server.py",
          ]

          with zipfile.ZipFile(wheel_path, "r") as z:
              namelist = z.namelist()
              for req in required_files:
                  if req not in namelist:
                      print(f"ERROR: Missing required file in wheel: {req}")
                      sys.exit(1)
                  info = z.getinfo(req)
                  print(f"  OK: {req} ({info.file_size} bytes)")

              # ARL-BUG-004: Release integrity gate - verify _ACTIVE_RULES_PATH is absolute
              catalog_src = z.read("ai_rule_learning_mcp/catalog.py").decode("utf-8")
              found_constant = False
              for line in catalog_src.splitlines():
                  if line.startswith("_ACTIVE_RULES_PATH ="):
                      found_constant = True
                      if "Path.home" not in line and "expanduser" not in line:
                          print(f"ERROR: Stale or relative _ACTIVE_RULES_PATH in built wheel: {line}")
                          sys.exit(1)
                      print(f"  OK: _ACTIVE_RULES_PATH verified absolute in wheel: {line.strip()}")
                      break
              if not found_constant:
                  print("ERROR: _ACTIVE_RULES_PATH constant definition not found in catalog.py inside wheel")
                  sys.exit(1)

          print("Wheel verification PASSED: all required catalog data, modules, and absolute path invariant verified.")
          EOF

      - name: Verify package with twine
        run: |
          twine check mcp/dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp/dist/
          attestations: false

      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8568693060:AAEQP0Tk60G3DMIh4xo3NS7wgyIyKYW16rA' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '7043475' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          status = os.environ.get("JOB_STATUS", "unknown").lower()
          repo = os.environ.get("GITHUB_REPOSITORY", "repo")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          ref = os.environ.get("GITHUB_REF_NAME", "")
          actor = os.environ.get("GITHUB_ACTOR", "")
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          icon = "📦" if status == "success" else "🚨"
          text = (
              f"{icon} *PyPI Release Deployment Alert*\n\n"
              f"*Workflow:* `Publish to PyPI`\n"
              f"*Status:* `{status.upper()}`\n"
              f"*Package:* `ai-rule-learning-mcp`\n"
              f"*Repository:* `{repo}`\n"
              f"*Tag/Ref:* `{ref}`\n"
              f"*Triggered By:* `{actor}`\n\n"
              f"[🔍 View Release Action Logs]({run_url})"
          )
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=json.dumps({"chat_id": chat_id, "text": text, "parse_mode": "Markdown"}).encode("utf-8"), headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as e:
              print(e)
          EOF
