name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  label:
    name: Apply PR labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label pull request
        uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
