name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Every npm package here is dev-only tooling (markdown lint/format, commit
      # hooks); nothing is shipped at runtime (the Space and the PyPI package are
      # Python). Gate the build on production dependencies — what actually ships.
      # The remaining high-severity advisories are unpatchable dev-dep transitives
      # (braces/micromatch stack-exhaustion DoS affects every version; katex
      # prototype pollution has no fix short of a breaking markdownlint-cli2
      # downgrade), so a blocking full audit would stay permanently red.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Full audit including dev dependencies, for visibility only. Non-blocking.
      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high || true
