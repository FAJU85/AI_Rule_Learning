name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'space/**'
      - '.github/workflows/deploy-space.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy space/ to Hugging Face
    runs-on: ubuntu-24.04
    env:
      SPACE_ID: ${{ vars.HF_SPACE_ID || 'vooom/AI_Rule_Learning' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.24.0"

      - name: Upload space/ to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TARGET_SPACE_ID: ${{ env.SPACE_ID }}
        run: |
          python - <<'EOF'
          import os
          import sys
          import time
          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError

          space_id = os.environ["TARGET_SPACE_ID"]
          token = os.environ.get("HF_TOKEN") or None
          if not token:
              print("ERROR: HF_TOKEN secret is not set; cannot authenticate to Hugging Face.", file=sys.stderr)
              sys.exit(1)
          api = HfApi(token=token)
          # Deploy straight to the EXISTING Space. We do NOT create_repo: creating a
          # new Gradio Space now requires an HF PRO subscription (402), and this Space
          # already exists. The SDK config comes from space/README.md.
          for attempt in range(1, 6):
              try:
                  api.upload_folder(
                      folder_path="space",
                      repo_id=space_id,
                      repo_type="space",
                      commit_message="Deploy space/ from GitHub Actions (${{ github.sha }})",
                  )
                  print(f"Deployed space/ to {space_id}.")
                  break
              except HfHubHTTPError as e:
                  code = getattr(getattr(e, "response", None), "status_code", None)
                  if code == 429 and attempt < 5:
                      wait = 2 ** attempt
                      print(f"Rate limited (429); retrying in {wait}s ({attempt}/5)...")
                      time.sleep(wait)
                      continue
                  print(f"Hugging Face API error ({code}): {e}", file=sys.stderr)
                  raise
          EOF

      - name: Smoke-test the Space (authenticated build-status check)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TARGET_SPACE_ID: ${{ env.SPACE_ID }}
        run: |
          python - <<'EOF'
          import os
          import sys
          import time
          from huggingface_hub import HfApi

          space_id = os.environ["TARGET_SPACE_ID"]
          api = HfApi(token=os.environ.get("HF_TOKEN") or None)
          # The Space is private and rebuilds after upload, so check build status via
          # the authenticated API rather than an unauthenticated HTTP GET. Fail only on
          # a real build/runtime error; a slow build warns but does not fail the deploy.
          deadline = time.time() + 420
          last = None
          while time.time() < deadline:
              try:
                  runtime = api.get_space_runtime(space_id)
                  stage = getattr(runtime, "stage", None)
              except Exception as e:
                  print(f"Could not read Space runtime ({type(e).__name__}: {e}); skipping smoke check.")
                  sys.exit(0)
              last = stage
              print(f"Space stage: {stage}")
              if stage == "RUNNING":
                  print("Space is RUNNING.")
                  sys.exit(0)
              if stage in ("BUILD_ERROR", "RUNTIME_ERROR", "CONFIG_ERROR"):
                  print(f"Space failed to come up: {stage}", file=sys.stderr)
                  sys.exit(1)
              time.sleep(15)
          print(
              f"Warning: Space not RUNNING within timeout (last stage: {last}); "
              "upload succeeded, the build may still be in progress."
          )
          sys.exit(0)
          EOF
