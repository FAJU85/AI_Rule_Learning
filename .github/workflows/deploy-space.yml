name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'space/**'
      - '.github/workflows/deploy-space.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to vooom/AI_Rule_Learning
    runs-on: ubuntu-latest
    env:
      HF_OIDC_RESOURCE: spaces/vooom/AI_Rule_Learning
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.24.0"

      - name: Deploy space/ to Hugging Face Space
        run: |
          python - <<'EOF'
          import time
          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError

          api = HfApi()
          for attempt in range(1, 6):
              try:
                  api.upload_folder(
                      folder_path="space",
                      repo_id="vooom/AI_Rule_Learning",
                      repo_type="space",
                      commit_message="Deploy from GitHub Actions (${{ github.sha }})",
                  )
                  print("Space deployed successfully.")
                  break
              except HfHubHTTPError as e:
                  if e.response is not None and e.response.status_code == 429 and attempt < 5:
                      wait = 2 ** attempt
                      print(f"Rate limited (429). Retrying in {wait}s (attempt {attempt}/5)...")
                      time.sleep(wait)
                  else:
                      raise
          EOF
