name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'space/**'
      - 'scripts/blue_green.py'
      - '.github/workflows/deploy-space.yml'
  workflow_dispatch:
    inputs:
      live_color:
        description: Current production color before this run
        required: true
        default: blue
        type: choice
        options:
          - blue
          - green
      operation:
        description: Deployment operation to run
        required: true
        default: deploy-and-smoke
        type: choice
        options:
          - deploy-and-smoke
          - deploy-and-cutover
          - rollback
      rollback_color:
        description: Previous known-good color for rollback operations
        required: false
        default: blue
        type: choice
        options:
          - blue
          - green

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy idle Space and smoke test
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' || inputs.operation != 'rollback' }}
    env:
      BG_BLUE_SPACE_ID: ${{ vars.BG_BLUE_SPACE_ID || 'vooom/AI_Rule_Learning' }}
      BG_GREEN_SPACE_ID: ${{ vars.BG_GREEN_SPACE_ID || 'vooom/AI_Rule_Learning_Green' }}
      BG_LIVE_COLOR: ${{ inputs.live_color || 'blue' }}
      BG_HEALTH_PATH: ${{ vars.BG_HEALTH_PATH || '/' }}
    outputs:
      idle_color: ${{ steps.plan.outputs.idle_color }}
      idle_space_id: ${{ steps.plan.outputs.idle_space_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.24.0"

      - name: Plan idle target
        id: plan
        run: |
          echo "idle_color=$(python scripts/blue_green.py plan --output-field idle_color)" >> "$GITHUB_OUTPUT"
          echo "idle_space_id=$(python scripts/blue_green.py plan --output-field idle_space_id)" >> "$GITHUB_OUTPUT"
          python scripts/blue_green.py plan

      - name: Deploy space/ to idle Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TARGET_SPACE_ID: ${{ steps.plan.outputs.idle_space_id }}
          HF_OIDC_RESOURCE: spaces/${{ steps.plan.outputs.idle_space_id }}
        run: |
          python - <<'EOF'
          import os
          import sys
          import time
          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError

          target_space_id = os.environ["TARGET_SPACE_ID"]
          token = os.environ.get("HF_TOKEN") or None
          api = HfApi(token=token)
          # Ensure the target (idle-color) Space exists before uploading. The green
          # Space may not have been provisioned yet; create_repo is idempotent with
          # exist_ok=True, so this is a no-op once it exists. SDK config is taken
          # from space/README.md on upload.
          try:
              api.create_repo(
                  repo_id=target_space_id,
                  repo_type="space",
                  space_sdk="gradio",
                  exist_ok=True,
              )
          except Exception as e:
              print(f"Warning: could not ensure Space exists ({type(e).__name__}: {e}); continuing to upload.", file=sys.stderr)
          for attempt in range(1, 6):
              try:
                  api.upload_folder(
                      folder_path="space",
                      repo_id=target_space_id,
                      repo_type="space",
                      commit_message="Deploy idle blue-green Space from GitHub Actions (${{ github.sha }})",
                  )
                  print(f"Space deployed successfully to {target_space_id}.")
                  break
              except HfHubHTTPError as e:
                  if e.response is not None and e.response.status_code == 429 and attempt < 5:
                      wait = 2 ** attempt
                      print(f"Rate limited (429). Retrying in {wait}s (attempt {attempt}/5)...")
                      time.sleep(wait)
                  else:
                      print(f"Hugging Face API HTTP error: {e}", file=sys.stderr)
                      if not token:
                          print("Hint: HF_TOKEN is not set. Ensure repository secret HF_TOKEN is configured or Trusted Publisher is enabled on Hugging Face.", file=sys.stderr)
                      raise
              except Exception as e:
                  print(f"Deployment error: {type(e).__name__}: {e}", file=sys.stderr)
                  if not token and "oauth/token" in str(e):
                      print("Hugging Face OIDC token exchange failed (400 Bad Request). Configure repository secret HF_TOKEN to enable authentication.", file=sys.stderr)
                  raise
          EOF

      - name: Smoke-test idle Space
        run: python scripts/blue_green.py smoke --color "${{ steps.plan.outputs.idle_color }}"

  cutover:
    name: Approved traffic cutover or rollback
    runs-on: ubuntu-24.04
    needs: deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-and-cutover' }}
    environment: production
    env:
      BG_BLUE_SPACE_ID: ${{ vars.BG_BLUE_SPACE_ID || 'vooom/AI_Rule_Learning' }}
      BG_GREEN_SPACE_ID: ${{ vars.BG_GREEN_SPACE_ID || 'vooom/AI_Rule_Learning_Green' }}
      BG_LIVE_COLOR: ${{ inputs.live_color }}
      BG_ROUTER_CUTOVER_URL: ${{ secrets.BG_ROUTER_CUTOVER_URL }}
      BG_ROUTER_TOKEN: ${{ secrets.BG_ROUTER_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Switch production traffic to idle color
        run: python scripts/blue_green.py cutover --target-color "${{ needs.deploy.outputs.idle_color }}" --commit-sha "${{ github.sha }}"

  rollback:
    name: Approved production rollback
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' }}
    environment: production
    env:
      BG_BLUE_SPACE_ID: ${{ vars.BG_BLUE_SPACE_ID || 'vooom/AI_Rule_Learning' }}
      BG_GREEN_SPACE_ID: ${{ vars.BG_GREEN_SPACE_ID || 'vooom/AI_Rule_Learning_Green' }}
      BG_LIVE_COLOR: ${{ inputs.live_color }}
      BG_ROUTER_CUTOVER_URL: ${{ secrets.BG_ROUTER_CUTOVER_URL }}
      BG_ROUTER_TOKEN: ${{ secrets.BG_ROUTER_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Switch production traffic to previous color
        run: python scripts/blue_green.py rollback --previous-color "${{ inputs.rollback_color }}" --commit-sha "${{ github.sha }}"
