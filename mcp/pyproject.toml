[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rule-learning-mcp"
version = "0.2.7"
description = "Local MCP server and CLI for learned AI guardrails, memory, skills, and agent config injection"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
keywords = ["mcp", "claude", "guardrails", "ai", "rules", "llm"]
authors = [{ name = "Fahad JUB", email = "info@tococolors.com" }]
license = { text = "Source Available — free for personal use, commercial/government use requires written permission. See https://github.com/faju85/ai_rule_learning/blob/main/LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "anyio>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Cloudflare R2 (S3-compatible) remote sync backend for store.py. Optional:
# the store is local-first and only syncs to R2 when boto3 is installed and
# the R2_* credentials are configured.
r2 = ["boto3>=1.34.0"]

[project.scripts]
ai-rule-learning-mcp = "ai_rule_learning_mcp.server:main"
ai-rule-learning = "ai_rule_learning_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/faju85/ai_rule_learning"
Repository = "https://github.com/faju85/ai_rule_learning"
"Bug Tracker" = "https://github.com/faju85/ai_rule_learning/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_rule_learning_mcp*"]

[tool.setuptools.package-data]
"ai_rule_learning_mcp" = ["data/*", "data/*.json", "data/*.jsonl"]

