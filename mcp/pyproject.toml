[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rule-learning-mcp"
version = "0.2.0"
description = "MCP server that learns guardrail rules from your AI conversations and injects them automatically"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
keywords = ["mcp", "claude", "guardrails", "ai", "rules", "llm"]
authors = [{ name = "Fahad JUB", email = "info@tococolors.com" }]
license = { text = "Source Available — free for personal use, commercial/government use requires written permission. See https://github.com/faju85/ai_rule_learning/blob/main/LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ai-rule-learning-mcp = "ai_rule_learning_mcp.server:main"
ai-rule-learning = "ai_rule_learning_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/faju85/ai_rule_learning"
Repository = "https://github.com/faju85/ai_rule_learning"
"Bug Tracker" = "https://github.com/faju85/ai_rule_learning/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_rule_learning_mcp*"]
