language: en-US
early_access: false
# CodeRabbit auto-review is disabled for this repository. Reviews, the review
# status check, summaries, and chat auto-replies are all turned off so the bot
# does not comment on or gate pull requests.
reviews:
  auto_review:
    enabled: false
  review_status: false
  high_level_summary: false
  poem: false
  collapse_walkthrough: true
chat:
  auto_reply: false
